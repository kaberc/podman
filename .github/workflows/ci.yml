name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check mod.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-net --allow-read --allow-write --allow-run --allow-env
        continue-on-error: false

  build-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: deno task build-npm 0.0.0-ci
      - run: node -e "const m = require('./npm/script/mod.js'); if (!m.createClient) process.exit(1); console.log('OK')"

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.18.0", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: deno task build-npm 0.0.0-ci
      - run: bun scripts/prepare_node_tests.mjs "$RUNNER_TEMP/podman-tests"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/test_node.mjs
      - run: node --test "$RUNNER_TEMP"/podman-tests/node_*_test.mjs

  bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.4.0", "1.4.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: deno task build-npm 0.0.0-ci
      - run: bun scripts/prepare_node_tests.mjs "$RUNNER_TEMP/podman-tests"
      - run: bun scripts/test_node.mjs
      - run: bun test "$RUNNER_TEMP"/podman-tests/*_test.mjs

  integration:
    runs-on: ubuntu-latest
    env:
      PODMAN_COMMIT: 85b994955e0b4e30fbce9c8351cab85676140ede
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: podman-container-tools/podman
          ref: ${{ env.PODMAN_COMMIT }}
          path: .podman-source
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build and start Podman 6.1.3
        run: scripts/setup_podman_ci.sh .podman-source "$RUNNER_TEMP/podman6"
      - run: deno test --allow-net --allow-read --allow-write --allow-run --allow-env tests/integration_test.ts
      - run: deno task build-npm 0.0.0-ci
      - run: node scripts/test_node.mjs
      - run: bun scripts/test_node.mjs
      - name: Show Podman diagnostics on failure
        if: failure()
        run: cat "$RUNNER_TEMP/podman6/service.log"
      - name: Stop Podman
        if: always()
        run: scripts/stop_podman_ci.sh "$RUNNER_TEMP/podman6"
